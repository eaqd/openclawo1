version: "3.9"

services:
  # ── Ollama: Local LLM inference engine ─────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: openclaw-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - claw-net
    deploy:
      resources:
        limits:
          memory: 6g
      # Uncomment for NVIDIA GPU support:
      # resources:
      #   reservations:
      #     devices:
      #       - driver: nvidia
      #         count: all
      #         capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

  # ── Model Initializer: Pulls the default model on first run ─
  ollama-init:
    image: ollama/ollama:latest
    container_name: openclaw-model-init
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - claw-net
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Pulling model: ${OLLAMA_MODEL:-qwen3.5:4b}..."
        ollama pull ${OLLAMA_MODEL:-qwen3.5:4b}
        echo "Model ready!"
    restart: "no"

  # ── OpenClaw: AI Assistant ─────────────────────────────────
  openclaw:
    image: ghcr.io/openclaw/openclaw:${OPENCLAW_VERSION:-latest}
    container_name: openclaw-app
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - HOME=/home/node
      - TERM=xterm-256color
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_API_KEY=ollama-local
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3.5:4b}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS:-}
      - OPENCLAW_LOG_LEVEL=${OPENCLAW_LOG_LEVEL:-info}
      - TZ=${TZ:-UTC}
    volumes:
      - openclaw-data:/home/node/.openclaw
      - openclaw-workspace:/home/node/.openclaw/workspace
      - ./skills:/home/node/.openclaw/skills:ro
    networks:
      - claw-net
    deploy:
      resources:
        limits:
          memory: 2g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    stdin_open: true
    tty: true

volumes:
  ollama-data:
    driver: local
  openclaw-data:
    driver: local
  openclaw-workspace:
    driver: local

networks:
  claw-net:
    driver: bridge
