<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenClaw Sandbox</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --accent: #f97316;
    --accent-hover: #ea580c;
    --user-bubble: #1f6feb;
    --bot-bubble: #21262d;
    --success: #3fb950;
    --danger: #f85149;
    --radius: 8px;
    --sidebar-width: 220px;
    --navbar-height: 52px;
  }
  [data-theme="light"] {
    --bg: #f0f2f5;
    --surface: #ffffff;
    --border: #d1d5db;
    --text: #1f2937;
    --text-muted: #6b7280;
    --bot-bubble: #e5e7eb;
    --user-bubble: #2563eb;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }
  /* ─── Navbar ─── */
  .navbar {
    height: var(--navbar-height);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
  }
  .navbar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
  }
  .navbar-brand .crab { font-size: 22px; }
  .navbar-right {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .status-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--danger);
    transition: background 0.3s;
  }
  .status-dot.online { background: var(--success); }
  .status-label {
    font-size: 12px;
    color: var(--text-muted);
  }
  .theme-toggle {
    background: var(--border);
    border: none;
    color: var(--text);
    width: 34px; height: 34px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .theme-toggle:hover { background: var(--accent); }
  .hamburger {
    display: none;
    background: none;
    border: none;
    color: var(--text);
    font-size: 22px;
    cursor: pointer;
  }
  /* ─── Layout ─── */
  .app-layout {
    display: flex;
    height: calc(100vh - var(--navbar-height));
    margin-top: var(--navbar-height);
  }
  /* ─── Sidebar ─── */
  .sidebar {
    width: var(--sidebar-width);
    min-width: var(--sidebar-width);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 12px 0;
    transition: transform 0.25s;
  }
  .sidebar-nav { list-style: none; }
  .sidebar-nav li {
    padding: 11px 22px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-muted);
    border-left: 3px solid transparent;
    transition: all 0.15s;
    user-select: none;
  }
  .sidebar-nav li:hover {
    color: var(--text);
    background: rgba(255,255,255,0.04);
  }
  .sidebar-nav li.active {
    color: var(--accent);
    border-left-color: var(--accent);
    background: rgba(249,115,22,0.08);
  }
  .sidebar-footer {
    margin-top: auto;
    padding: 14px 22px;
    font-size: 11px;
    color: var(--text-muted);
    border-top: 1px solid var(--border);
  }
  /* ─── Main ─── */
  .main-content {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
  }
  .view { display: none; height: 100%; }
  .view.active { display: flex; flex-direction: column; }
  /* ─── Buttons ─── */
  .btn {
    padding: 8px 16px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    font-weight: 500;
    transition: all 0.15s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: #fff; }
  .btn-danger { border-color: var(--danger); color: var(--danger); }
  .btn-danger:hover { background: var(--danger); color: #fff; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  /* ─── Inputs ─── */
  input[type="text"], select, textarea {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    padding: 9px 12px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
    width: 100%;
  }
  input[type="text"]:focus, select:focus, textarea:focus {
    border-color: var(--accent);
  }
  select { cursor: pointer; }
  /* ─── Cards ─── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 14px;
  }
  .card-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }
  .stat-value { font-size: 28px; font-weight: 700; color: var(--accent); }
  /* ─── Chat ─── */
  .chat-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .chat-header select { max-width: 280px; }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg { display: flex; gap: 10px; max-width: 85%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.bot { align-self: flex-start; }
  .msg-avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .msg.user .msg-avatar { background: var(--user-bubble); color: #fff; }
  .msg.bot .msg-avatar { background: var(--accent); color: #fff; }
  .msg-bubble {
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.55;
    word-break: break-word;
  }
  .msg.user .msg-bubble { background: var(--user-bubble); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot .msg-bubble { background: var(--bot-bubble); border-bottom-left-radius: 4px; }
  .msg-bubble pre {
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    margin: 8px 0;
    overflow-x: auto;
    font-size: 13px;
    position: relative;
  }
  .msg-bubble code {
    font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    font-size: 13px;
  }
  .msg-bubble code.inline {
    background: rgba(249,115,22,0.15);
    padding: 2px 6px;
    border-radius: 4px;
  }
  .copy-btn {
    position: absolute;
    top: 6px; right: 6px;
    background: var(--border);
    border: none;
    color: var(--text-muted);
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .copy-btn:hover { background: var(--accent); color: #fff; }
  .chat-input-area {
    display: flex;
    gap: 10px;
    margin-top: 12px;
    align-items: flex-end;
  }
  .chat-input-area textarea {
    flex: 1;
    resize: none;
    min-height: 44px;
    max-height: 140px;
  }
  /* ─── Models ─── */
  .model-list { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .model-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .model-info { flex: 1; min-width: 180px; }
  .model-name { font-weight: 600; font-size: 15px; }
  .model-meta { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
  .model-actions { display: flex; gap: 8px; }
  .pull-area {
    display: flex; gap: 10px; margin-bottom: 16px; align-items: center; flex-wrap: wrap;
  }
  .pull-area input { max-width: 320px; }
  .pull-progress {
    font-size: 13px; color: var(--text-muted); margin-top: 4px;
    min-height: 20px;
  }
  /* ─── System ─── */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px;
    margin-bottom: 20px;
  }
  .quick-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  /* ─── Settings ─── */
  .settings-group {
    margin-bottom: 22px;
  }
  .settings-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .settings-row {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .settings-row input[type="text"], .settings-row select { max-width: 400px; }
  .toggle-switch {
    position: relative;
    width: 48px; height: 26px;
    display: inline-block;
  }
  .toggle-switch input { opacity: 0; width: 0; height: 0; }
  .toggle-slider {
    position: absolute;
    inset: 0;
    background: var(--border);
    border-radius: 26px;
    cursor: pointer;
    transition: 0.2s;
  }
  .toggle-slider::before {
    content: '';
    position: absolute;
    width: 20px; height: 20px;
    left: 3px; top: 3px;
    background: #fff;
    border-radius: 50%;
    transition: 0.2s;
  }
  .toggle-switch input:checked + .toggle-slider { background: var(--accent); }
  .toggle-switch input:checked + .toggle-slider::before { transform: translateX(22px); }
  .section-title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  /* ─── Responsive ─── */
  @media (max-width: 768px) {
    .hamburger { display: block; }
    .sidebar {
      position: fixed;
      top: var(--navbar-height);
      left: 0;
      bottom: 0;
      z-index: 90;
      transform: translateX(-100%);
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      top: var(--navbar-height);
      background: rgba(0,0,0,0.5);
      z-index: 89;
    }
    .sidebar-overlay.open { display: block; }
    .main-content { padding: 16px; }
    .msg { max-width: 95%; }
    .chat-header select { max-width: 100%; }
  }
  /* ─── Scrollbar ─── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
</style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
  <div style="display:flex;align-items:center;gap:14px;">
    <button class="hamburger" onclick="toggleSidebar()" aria-label="Menu">&#9776;</button>
    <div class="navbar-brand">
      <span class="crab">&#129408;</span>
      <span>OpenClaw Sandbox</span>
    </div>
  </div>
  <div class="navbar-right">
    <span class="status-label" id="statusLabel">Disconnected</span>
    <span class="status-dot" id="statusDot"></span>
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn" title="Toggle theme">&#9790;</button>
  </div>
</nav>

<!-- Sidebar overlay for mobile -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<!-- Layout -->
<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <ul class="sidebar-nav" id="sidebarNav">
      <li class="active" data-view="chat">Chat</li>
      <li data-view="models">Models</li>
      <li data-view="system">System</li>
      <li data-view="settings">Settings</li>
    </ul>
    <div class="sidebar-footer">OpenClaw v1.0<br>AI Sandbox Dashboard</div>
  </aside>

  <main class="main-content">

    <!-- Chat View -->
    <section class="view active" id="view-chat">
      <div class="chat-header">
        <select id="chatModelSelect"><option value="">Loading models...</option></select>
        <button class="btn" onclick="newChat()">New Chat</button>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-area">
        <textarea id="chatInput" placeholder="Type a message... (Enter to send, Shift+Enter for newline)" rows="1"></textarea>
        <button class="btn btn-primary" onclick="sendMessage()" id="sendBtn">Send</button>
      </div>
    </section>

    <!-- Models View -->
    <section class="view" id="view-models">
      <div class="section-title">Installed Models</div>
      <div class="pull-area">
        <input type="text" id="pullModelName" placeholder="Model name (e.g. llama3)">
        <button class="btn btn-primary" onclick="pullModel()">Pull Model</button>
      </div>
      <div class="pull-progress" id="pullProgress"></div>
      <div class="model-list" id="modelList">
        <div style="color:var(--text-muted)">Loading models...</div>
      </div>
    </section>

    <!-- System View -->
    <section class="view" id="view-system">
      <div class="section-title">System Overview</div>
      <div class="stat-grid">
        <div class="card">
          <div class="card-title">Connection</div>
          <div id="sysStatus" style="font-size:16px;font-weight:600;">Checking...</div>
        </div>
        <div class="card">
          <div class="card-title">Ollama URL</div>
          <div id="sysUrl" style="font-size:14px;word-break:break-all;">-</div>
        </div>
        <div class="card">
          <div class="card-title">Models Installed</div>
          <div class="stat-value" id="sysModelCount">-</div>
        </div>
        <div class="card">
          <div class="card-title">Total Disk Usage</div>
          <div class="stat-value" id="sysDiskSize">-</div>
        </div>
        <div class="card">
          <div class="card-title">Page Uptime</div>
          <div class="stat-value" id="sysUptime">0s</div>
        </div>
        <div class="card">
          <div class="card-title">Last Checked</div>
          <div id="sysLastCheck" style="font-size:14px;">-</div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">Quick Actions</div>
        <div class="quick-actions">
          <button class="btn" onclick="checkStatus()">Refresh Status</button>
          <button class="btn" onclick="loadModels()">Reload Models</button>
          <button class="btn" onclick="switchView('chat')">Open Chat</button>
          <button class="btn" onclick="switchView('settings')">Open Settings</button>
        </div>
      </div>
    </section>

    <!-- Settings View -->
    <section class="view" id="view-settings">
      <div class="section-title">Settings</div>

      <div class="settings-group">
        <label>Ollama URL</label>
        <div class="settings-row">
          <input type="text" id="settingsUrl" placeholder="http://localhost:11434">
          <button class="btn btn-primary" onclick="saveUrl()">Save</button>
        </div>
      </div>

      <div class="settings-group">
        <label>Default Model</label>
        <div class="settings-row">
          <select id="settingsModel"><option value="">Select a model</option></select>
          <button class="btn" onclick="saveDefaultModel()">Set Default</button>
        </div>
      </div>

      <div class="settings-group">
        <label>Theme</label>
        <div class="settings-row" style="gap:14px;">
          <span style="font-size:14px;">Dark</span>
          <label class="toggle-switch">
            <input type="checkbox" id="settingsThemeToggle" onchange="toggleThemeFromSwitch()">
            <span class="toggle-slider"></span>
          </label>
          <span style="font-size:14px;">Light</span>
        </div>
      </div>

      <div class="settings-group">
        <label>Configuration</label>
        <div class="settings-row">
          <button class="btn" onclick="exportConfig()">Export Config</button>
          <button class="btn" onclick="document.getElementById('importFile').click()">Import Config</button>
          <input type="file" id="importFile" accept=".json" style="display:none" onchange="importConfig(event)">
          <button class="btn btn-danger" onclick="resetConfig()">Reset All</button>
        </div>
      </div>
    </section>

  </main>
</div>

<script>
// ─── Config ───
const DEFAULT_CONFIG = {
  ollamaUrl: 'http://localhost:11434',
  model: '',
  theme: 'dark'
};

let CONFIG = loadConfig();
let isOnline = false;
let chatHistory = [];
let abortController = null;
const startTime = Date.now();

function loadConfig() {
  try {
    const saved = localStorage.getItem('openclaw_config');
    if (saved) return { ...DEFAULT_CONFIG, ...JSON.parse(saved) };
  } catch (e) { /* ignore */ }
  return { ...DEFAULT_CONFIG };
}

function saveConfig() {
  localStorage.setItem('openclaw_config', JSON.stringify(CONFIG));
}

// ─── Helpers ───
function formatBytes(n) {
  if (!n || n === 0) return '0 B';
  const units = ['B', 'KB', 'MB', 'GB', 'TB'];
  const i = Math.floor(Math.log(n) / Math.log(1024));
  return (n / Math.pow(1024, i)).toFixed(i > 1 ? 2 : 0) + ' ' + units[i];
}

function escapeHtml(str) {
  const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  return str.replace(/[&<>"']/g, c => map[c]);
}

function renderMarkdown(text) {
  let html = escapeHtml(text);
  // Code blocks: ```lang\ncode\n```
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, function(_, lang, code) {
    const id = 'code-' + Math.random().toString(36).slice(2, 9);
    return '<pre><button class="copy-btn" onclick="copyCode(\'' + id + '\')">Copy</button><code id="' + id + '">' + code.trim() + '</code></pre>';
  });
  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code class="inline">$1</code>');
  // Line breaks
  html = html.replace(/\n/g, '<br>');
  return html;
}

function copyCode(id) {
  const el = document.getElementById(id);
  if (el) {
    navigator.clipboard.writeText(el.textContent).then(() => {
      const btn = el.parentElement.querySelector('.copy-btn');
      if (btn) { btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = 'Copy', 1500); }
    });
  }
}

function formatUptime(ms) {
  const s = Math.floor(ms / 1000);
  if (s < 60) return s + 's';
  const m = Math.floor(s / 60);
  if (m < 60) return m + 'm ' + (s % 60) + 's';
  const h = Math.floor(m / 60);
  return h + 'h ' + (m % 60) + 'm';
}

// ─── Theme ───
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  CONFIG.theme = theme;
  saveConfig();
  const btn = document.getElementById('themeBtn');
  btn.innerHTML = theme === 'dark' ? '&#9790;' : '&#9728;';
  const toggle = document.getElementById('settingsThemeToggle');
  if (toggle) toggle.checked = theme === 'light';
}

function toggleTheme() {
  applyTheme(CONFIG.theme === 'dark' ? 'light' : 'dark');
}

function toggleThemeFromSwitch() {
  const toggle = document.getElementById('settingsThemeToggle');
  applyTheme(toggle.checked ? 'light' : 'dark');
}

// ─── Sidebar ───
function switchView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.sidebar-nav li').forEach(li => li.classList.remove('active'));
  const view = document.getElementById('view-' + name);
  if (view) view.classList.add('active');
  const navItem = document.querySelector('[data-view="' + name + '"]');
  if (navItem) navItem.classList.add('active');
  // Close mobile sidebar
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
  // Refresh data for certain views
  if (name === 'models') loadModels();
  if (name === 'system') updateSystemView();
}

document.getElementById('sidebarNav').addEventListener('click', function(e) {
  const li = e.target.closest('li');
  if (li && li.dataset.view) switchView(li.dataset.view);
});

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('open');
}

// ─── Status Check ───
async function checkStatus() {
  const dot = document.getElementById('statusDot');
  const label = document.getElementById('statusLabel');
  try {
    const res = await fetch(CONFIG.ollamaUrl + '/api/tags', { signal: AbortSignal.timeout(5000) });
    if (res.ok) {
      isOnline = true;
      dot.classList.add('online');
      label.textContent = 'Connected';
      const data = await res.json();
      window._cachedModels = data.models || [];
      return data.models || [];
    }
  } catch (e) { /* offline */ }
  isOnline = false;
  dot.classList.remove('online');
  label.textContent = 'Disconnected';
  return null;
}

// ─── Models ───
async function loadModels() {
  const models = await checkStatus();
  populateModelSelects(models);
  renderModelList(models);
}

function populateModelSelects(models) {
  const selects = [
    document.getElementById('chatModelSelect'),
    document.getElementById('settingsModel')
  ];
  selects.forEach(sel => {
    if (!sel) return;
    const current = sel.value;
    sel.innerHTML = '';
    if (!models || models.length === 0) {
      sel.innerHTML = '<option value="">No models available</option>';
      return;
    }
    models.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m.name;
      opt.textContent = m.name;
      sel.appendChild(opt);
    });
    // Restore selection
    if (CONFIG.model && models.some(m => m.name === CONFIG.model)) {
      sel.value = CONFIG.model;
    } else if (current && models.some(m => m.name === current)) {
      sel.value = current;
    }
  });
}

function renderModelList(models) {
  const container = document.getElementById('modelList');
  if (!models || models.length === 0) {
    container.innerHTML = '<div style="color:var(--text-muted);padding:20px 0;">No models installed. Pull a model to get started.</div>';
    return;
  }
  container.innerHTML = models.map(m => {
    const family = m.details && m.details.family ? m.details.family : 'unknown';
    const paramSize = m.details && m.details.parameter_size ? m.details.parameter_size : '';
    const sizeStr = formatBytes(m.size);
    const isDefault = CONFIG.model === m.name;
    return '<div class="model-card">' +
      '<div class="model-info">' +
        '<div class="model-name">' + escapeHtml(m.name) +
          (isDefault ? ' <span style="color:var(--accent);font-size:11px;font-weight:400;">(default)</span>' : '') +
        '</div>' +
        '<div class="model-meta">' + sizeStr + ' &middot; ' + escapeHtml(family) +
          (paramSize ? ' &middot; ' + escapeHtml(paramSize) : '') +
        '</div>' +
      '</div>' +
      '<div class="model-actions">' +
        '<button class="btn btn-sm" onclick="setDefaultModel(\'' + escapeHtml(m.name) + '\')">Set Default</button>' +
        '<button class="btn btn-sm btn-danger" onclick="deleteModel(\'' + escapeHtml(m.name) + '\')">Delete</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

function setDefaultModel(name) {
  CONFIG.model = name;
  saveConfig();
  loadModels();
}

async function deleteModel(name) {
  if (!confirm('Delete model "' + name + '"? This cannot be undone.')) return;
  try {
    await fetch(CONFIG.ollamaUrl + '/api/delete', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name })
    });
    loadModels();
  } catch (e) {
    alert('Failed to delete model: ' + e.message);
  }
}

async function pullModel() {
  const input = document.getElementById('pullModelName');
  const name = input.value.trim();
  if (!name) return;
  const progress = document.getElementById('pullProgress');
  progress.textContent = 'Starting pull for ' + name + '...';
  try {
    const res = await fetch(CONFIG.ollamaUrl + '/api/pull', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, stream: true })
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        try {
          const data = JSON.parse(line);
          if (data.status) {
            let msg = data.status;
            if (data.total && data.completed) {
              const pct = Math.round((data.completed / data.total) * 100);
              msg += ' — ' + pct + '% (' + formatBytes(data.completed) + ' / ' + formatBytes(data.total) + ')';
            }
            progress.textContent = msg;
          }
          if (data.error) {
            progress.textContent = 'Error: ' + data.error;
            return;
          }
        } catch (e) { /* skip */ }
      }
    }
    progress.textContent = 'Successfully pulled ' + name;
    input.value = '';
    setTimeout(() => { progress.textContent = ''; }, 4000);
    loadModels();
  } catch (e) {
    progress.textContent = 'Pull failed: ' + e.message;
  }
}

// ─── Chat ───
function getSelectedModel() {
  const sel = document.getElementById('chatModelSelect');
  return sel.value || CONFIG.model || '';
}

function newChat() {
  chatHistory = [];
  document.getElementById('chatMessages').innerHTML = '';
}

function addMessageToUI(role, content) {
  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  const avatarLabel = role === 'user' ? 'U' : 'AI';
  div.innerHTML =
    '<div class="msg-avatar">' + avatarLabel + '</div>' +
    '<div class="msg-bubble">' + renderMarkdown(content) + '</div>';
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return div;
}

function updateBotMessage(div, content) {
  const bubble = div.querySelector('.msg-bubble');
  if (bubble) bubble.innerHTML = renderMarkdown(content);
  const container = document.getElementById('chatMessages');
  container.scrollTop = container.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  const model = getSelectedModel();
  if (!model) {
    alert('Please select a model first.');
    return;
  }
  input.value = '';
  input.style.height = 'auto';
  chatHistory.push({ role: 'user', content: text });
  addMessageToUI('user', text);
  const botDiv = addMessageToUI('assistant', '');
  const sendBtn = document.getElementById('sendBtn');
  sendBtn.textContent = 'Stop';
  sendBtn.onclick = stopGeneration;
  abortController = new AbortController();
  let fullResponse = '';
  try {
    const res = await fetch(CONFIG.ollamaUrl + '/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: model,
        messages: chatHistory,
        stream: true
      }),
      signal: abortController.signal
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        try {
          const data = JSON.parse(line);
          if (data.message && data.message.content) {
            fullResponse += data.message.content;
            updateBotMessage(botDiv, fullResponse);
          }
        } catch (e) { /* skip */ }
      }
    }
    chatHistory.push({ role: 'assistant', content: fullResponse });
  } catch (e) {
    if (e.name === 'AbortError') {
      if (fullResponse) {
        chatHistory.push({ role: 'assistant', content: fullResponse });
      }
      updateBotMessage(botDiv, fullResponse + '\n\n*(generation stopped)*');
    } else {
      updateBotMessage(botDiv, '**Error:** ' + escapeHtml(e.message));
    }
  }
  sendBtn.textContent = 'Send';
  sendBtn.onclick = sendMessage;
  abortController = null;
}

function stopGeneration() {
  if (abortController) abortController.abort();
}

// ─── Chat input handling ───
const chatInput = document.getElementById('chatInput');
chatInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
chatInput.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 140) + 'px';
});

// ─── System View ───
function updateSystemView() {
  document.getElementById('sysUrl').textContent = CONFIG.ollamaUrl;
  document.getElementById('sysStatus').innerHTML = isOnline
    ? '<span style="color:var(--success);">&#9679; Online</span>'
    : '<span style="color:var(--danger);">&#9679; Offline</span>';
  const models = window._cachedModels || [];
  document.getElementById('sysModelCount').textContent = models.length;
  const totalSize = models.reduce((acc, m) => acc + (m.size || 0), 0);
  document.getElementById('sysDiskSize').textContent = formatBytes(totalSize);
  document.getElementById('sysLastCheck').textContent = new Date().toLocaleTimeString();
}

// ─── Settings ───
function saveUrl() {
  const input = document.getElementById('settingsUrl');
  let url = input.value.trim();
  if (!url) return;
  // Remove trailing slash
  url = url.replace(/\/+$/, '');
  CONFIG.ollamaUrl = url;
  saveConfig();
  checkStatus().then(() => updateSystemView());
  loadModels();
}

function saveDefaultModel() {
  const sel = document.getElementById('settingsModel');
  if (sel.value) {
    CONFIG.model = sel.value;
    saveConfig();
  }
}

function exportConfig() {
  const blob = new Blob([JSON.stringify(CONFIG, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'openclaw-config.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importConfig(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      CONFIG = { ...DEFAULT_CONFIG, ...imported };
      saveConfig();
      applyTheme(CONFIG.theme);
      document.getElementById('settingsUrl').value = CONFIG.ollamaUrl;
      loadModels();
      alert('Configuration imported successfully.');
    } catch (err) {
      alert('Invalid config file.');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function resetConfig() {
  if (!confirm('Reset all settings to defaults? This will clear your configuration.')) return;
  CONFIG = { ...DEFAULT_CONFIG };
  saveConfig();
  applyTheme(CONFIG.theme);
  document.getElementById('settingsUrl').value = CONFIG.ollamaUrl;
  newChat();
  loadModels();
}

// ─── Init ───
function init() {
  applyTheme(CONFIG.theme);
  document.getElementById('settingsUrl').value = CONFIG.ollamaUrl;
  loadModels();
  // Periodic status check
  setInterval(() => {
    checkStatus().then(() => {
      // Update system view if visible
      const sysView = document.getElementById('view-system');
      if (sysView.classList.contains('active')) updateSystemView();
    });
  }, 10000);
  // Uptime counter
  setInterval(() => {
    const el = document.getElementById('sysUptime');
    if (el) el.textContent = formatUptime(Date.now() - startTime);
  }, 1000);
}

init();
</script>
